image:
  repository: dashboard
  tag: "0.1.0"
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: traefik
  host: dashboard.localhost
  annotations: {}      # for example cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: false
    secretName: dashboard-tls

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi